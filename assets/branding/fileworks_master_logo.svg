<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Depth -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Vertical Spine Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Top Document Arm Gradient -->
    <linearGradient id="topArmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Fold Flap Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <!-- Middle Utility Arm Gradient -->
    <linearGradient id="midArmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Symbol Group (Centered 256, 256) -->
  <g id="fileworks-symbol">
    <!-- Layer 1: Vertical Stem (Spine) -->
    <rect x="140" y="122" width="78" height="268" rx="18" fill="url(#stemGrad)"/>

    <!-- Layer 2: Top Document Arm with 45-degree Dog-Ear Chamfer -->
    <path d="M 158 122
             L 306 122
             L 372 188
             L 372 190
             A 16 16 0 0 1 356 206
             L 218 206
             L 218 140
             A 18 18 0 0 0 200 122
             Z"
          fill="url(#topArmGrad)"/>

    <!-- Top-left smooth radius fill -->
    <rect x="140" y="122" width="36" height="36" rx="18" fill="url(#topArmGrad)"/>

    <!-- Layer 3: True Inward Dog-Ear Document Fold -->
    <!-- Triangle flap folded inward from the (306, 122) - (372, 188) diagonal crease -->
    <polygon points="306,122 306,188 372,188" fill="url(#foldGrad)"/>
    <!-- Crisp Crease Line -->
    <line x1="306" y1="122" x2="372" y2="188" stroke="#EEF2FF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Layer 4: Middle Utility / Action Arm -->
    <rect x="214" y="244" width="118" height="72" rx="16" fill="url(#midArmGrad)"/>
  </g>
</svg>
